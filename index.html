     <div id="desktop" style="display:none">

      <div class="icon" onclick="openApp('paint')">

      <div class="iconBox">✏</div>
          <div>Paintcenter</div>
    </div>
  </div>
  <!-- hooray completed -->
   <div id="windows"></div>
